<!DOCTYPE html>
<!-- Developed with assistance from Claude (Anthropic). -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="ai-assistance" content="Code developed with assistance from Claude (Anthropic). Data processing and method by the Orbitrary team.">
  <title>Orbitrary — Target analysis</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <link rel="stylesheet" href="css/style.css?v=11151256">
  <link rel="stylesheet" href="css/analiz.css?v=11151256">
</head>
<body class="yildizli">
  <header class="ust">
    <a href="index.html#hero" class="btn-link ev-btn">← Home</a>
    <button class="geri-btn" onclick="history.length > 1 ? history.back() : (location.href = 'index.html')">← Back</button>
    <a href="index.html" class="logo" aria-label="Orbitrary">ORBITR<span class="ters">A</span>RY</a>
    <nav>
      <a href="explore.html">Explore</a>
      <a href="target.html" class="aktif">Targets</a>
      <a href="analogs.html">Analog sites</a>
      <a href="index.html#yontem">Method</a>
    </nav>
  </header>

  <section class="kahraman" id="kahraman">
    <div>
      <div class="etiket" id="k-ust">Target search</div>
      <h1 id="k-baslik">Targets</h1>
      <p id="k-alt"></p>
      <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:16px" id="k-butonlar"></div>
    </div>
  </section>

  <main class="sayfa" id="icerik"></main>

  <footer style="padding:30px 5vw;border-top:1px solid var(--line);display:flex;gap:18px;flex-wrap:wrap;align-items:center">
    <a href="index.html#hero" class="btn-link">← Home</a>
    <button class="btn-link" onclick="window.scrollTo({top:0,behavior:'smooth'})">Back to top ↑</button>
    <span class="soluk" style="font-size:13px">NASA Space Apps Challenge 2026 project. Not an official NASA website. Every number on this page is read from the project's result files. Code developed with assistance from Claude (Anthropic).</span>
  </footer>

  <script type="module">
    import * as V from './js/veri.js?v=11151256';
    const $ = s => document.querySelector(s);
    const PARAM = new URLSearchParams(location.search);
    const id = PARAM.get('id');
    const [T, H, O, F] = await Promise.all([V.metin(), V.hedefler(), V.ozet(), V.hedefFoto()]);
    const govdeAd = c => c === 'ay' ? 'Moon' : 'Mars';
    const fotoUrl = k => F[k] ? `img/hedef/${k}.jpg` : null;
    // Güney kutbu konum haritası: kutba açısal uzaklık r = 90° + enlem (en fazla 7°), 0° boylam yukarıda, 90°D sağda
    const KUTUP = H.filter(x => x.cisim === 'ay' && x.enlem < -80);
    function kutupSvg(h) {
      if (!(h.cisim === 'ay' && h.enlem < -80)) return '';
      const R = 7, P = x => { const r = (90 + x.enlem) / R * 44, a = x.boylam * Math.PI / 180; return [50 + r * Math.sin(a), 50 - r * Math.cos(a)]; };
      const halka = [2, 4, 6].map(d => `<circle cx="50" cy="50" r="${d / R * 44}" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="0.6"/>`).join('');
      const nokta = KUTUP.map(x => { const [px, py] = P(x), ben = x.kimlik === h.kimlik;
        return `<circle cx="${px.toFixed(1)}" cy="${py.toFixed(1)}" r="${ben ? 4 : 1.8}" fill="${ben ? '#5cc8ff' : 'rgba(255,255,255,0.7)'}" ${ben ? 'stroke="#fff" stroke-width="1"' : ''}/>`; }).join('');
      return `<svg class="kutup-svg" viewBox="0 0 100 100" aria-label="Location near the lunar south pole">
        <circle cx="50" cy="50" r="48" fill="rgba(3,5,12,0.72)" stroke="rgba(255,255,255,0.35)"/>${halka}
        <path d="M50 44v12M44 50h12" stroke="rgba(255,255,255,0.5)" stroke-width="0.6"/>${nokta}
        <text x="50" y="97" text-anchor="middle" font-size="7" fill="#cfd7e3" font-family="Space Grotesk">south pole · rings 2°, 4°, 6°</text></svg>`;
    }

    if (!id) liste(); else hedefSayfasi(id);

    // ---------- 26 hedef listesi ----------
    function liste() {
      $('#k-ust').textContent = '26 targets · Moon and Mars';
      $('#k-baslik').textContent = 'Where on Earth is most like…';
      $('#k-alt').textContent = 'Pick a place on the Moon or Mars. For each one we scored all ' + O.E_prime.toLocaleString('en') +
        ' land windows on Earth, with no shortcut, and show the ten closest Earth sites for each of five missions.';
      const ilkFoto = H.map(h => fotoUrl(h.kimlik)).find(Boolean);
      if (ilkFoto) $('#kahraman').style.setProperty('--kahraman-foto', `url(${new URL(ilkFoto, location.href).href})`);
      const grup = [
        ['Artemis', h => String(h.kimlik).startsWith('A3-'), T.uyari.artemis],
        ['Moon', h => h.cisim === 'ay' && !String(h.kimlik).startsWith('A3-'), 'Apollo landing sites and other lunar targets'],
        ['Mars', h => h.cisim === 'mars', 'Mars landing sites']];
      $('#icerik').innerHTML = `
        <div class="terim">
          <div class="kutu"><div class="etiket">Target</div><div class="alt"><b>A place on the Moon or Mars</b>, for example an Apollo landing site, an Artemis candidate region or a rover landing site.</div></div>
          <div class="kutu"><div class="etiket">Analog</div><div class="alt"><b>A place on Earth</b> that resembles the target, where astronauts can train or equipment can be tested.</div></div>
          <div class="kutu"><div class="etiket">Score</div><div class="alt"><b>How alike the two places are, from 0% to 100%</b>, across eight categories and weighted for the chosen mission.</div></div>
        </div>` + grup.map(([ad, f, alt]) => `
        <h2 style="margin:40px 0 6px;font-size:26px">${ad}</h2><p class="soluk" style="margin-bottom:16px">${alt}</p>
        <div class="hedef-izgara">${H.filter(f).map(h => `
          <a class="hedef-kart" href="target.html?id=${encodeURIComponent(h.kimlik)}">
            <div class="hk-foto" style="${fotoUrl(h.kimlik) ? `background-image:url(${fotoUrl(h.kimlik)})` : ''}">${kutupSvg(h)}</div>
            <div class="hk-ic"><div class="etiket">${govdeAd(h.cisim)} · ${h.kimlik}</div>
            <div style="font-size:18px;font-weight:600;margin:6px 0">${h.ad}</div>
            <div class="soluk mono" style="font-size:13px">${V.koordYazi(h.enlem, h.boylam)}</div>
            <div style="margin-top:10px;color:var(--accent);font-size:14px">See the full analysis →</div></div>
          </a>`).join('')}</div>`).join('');
    }

    // ---------- Bir hedefin tam analizi ----------
    async function hedefSayfasi(id) {
      const h = H.find(x => x.kimlik === id);
      if (!h) { $('#icerik').innerHTML = '<p>Unknown target.</p>'; return; }
      const L_ = await V.liste(id);
      document.title = `Orbitrary — ${h.ad}`;
      if (fotoUrl(id)) {
        $('#kahraman').style.setProperty('--kahraman-foto', `url(${new URL(fotoUrl(id), location.href).href})`);
        $('#kahraman').insertAdjacentHTML('beforeend', `<div class="foto-kredi">Photo: NASA · ${F[id].baslik} (${F[id].nasa_id})</div>`);
      }
      $('#kahraman').insertAdjacentHTML('beforeend', kutupSvg(h));
      $('#k-ust').textContent = `${govdeAd(h.cisim)} · ${h.kimlik}${h.etiket ? ' · ' + h.etiket : ''}`;
      $('#k-baslik').textContent = h.ad;
      $('#k-alt').innerHTML = `${V.koordYazi(h.enlem, h.boylam, 3)} · ${h.koordinat_notu || ('source: ' + String(h.kaynak).replace(/ ve ark\./g, ' et al.').replace(/ ve /g, ' and '))}.<br>
        We compared this site with all ${O.E_prime.toLocaleString('en')} land windows on Earth (20 × 20 km each) in eight categories. Choose a mission below to see the ten Earth sites that come closest.`;
      $('#k-butonlar').innerHTML = `<a class="btn-ana" href="explore.html?body=${h.cisim === 'ay' ? 'moon' : 'mars'}&lat=${h.enlem}&lon=${h.boylam}&hedef=${encodeURIComponent(h.kimlik)}">Open in Explore 3D →</a>
        <a class="btn-link" href="target.html">All 26 targets</a>`;
      const eksikHedef = L_.hedef.kategori_var.map((v, k) => v ? null : V.KAT_AD[k]).filter(Boolean);
      $('#icerik').innerHTML = `
        <div class="sekmeler" id="sekmeler">${V.GOREV_SIRA.map(g => `<button data-g="${g}">${T.gorev[g].ad}</button>`).join('')}</div>
        <p id="soru" style="font-size:19px;margin-bottom:6px"></p>
        ${eksikHedef.length ? `<p class="soluk" style="font-size:13.5px">No data for this target in: ${eksikHedef.join(', ')}. These categories are left out of the score.${!L_.hedef.islak ? ' ' + T.uyari.kuru_hedef : ''}</p>` : ''}
        <div id="gorev-icerik"></div>`;
      const sec = g => {
        document.querySelectorAll('#sekmeler button').forEach(b => b.classList.toggle('secili', b.dataset.g === g));
        $('#soru').textContent = T.gorev[g].soru;
        gorevCiz(h, L_, g);
        history.replaceState(null, '', `?id=${encodeURIComponent(id)}&gorev=${g}`);
      };
      document.querySelectorAll('#sekmeler button').forEach(b => b.addEventListener('click', () => sec(b.dataset.g)));
      sec(V.GOREV_SIRA.includes(PARAM.get('gorev')) ? PARAM.get('gorev') : 'genel');
    }

    function katCubuklari(s, w) {
      return s.map((x, k) => `<div class="kat-cubuk"><span>${V.KAT_AD[k]}</span>
        <div class="cubuk ${x == null ? 'bos' : ''}"><i style="width:${x == null ? 0 : (100 * x).toFixed(1)}%"></i></div>
        <span class="mono" style="text-align:right">${x == null ? 'no data' : V.yuzde(x)}</span></div>`).join('');
    }

    async function gorevCiz(h, L_, g) {
      const o = L_.gorevler[g], kok = $('#gorev-icerik');
      if (!o || o.durum !== 'computed') {
        kok.innerHTML = `<div class="kart2" style="margin-top:20px"><h2>Not applicable</h2><p class="soluk">${T.uyari.kuru_hedef}</p></div>`;
        return;
      }
      const ilk = o.ilk10, w = await V.agirliklar(g);
      const d = o.duyarlilik || {};
      const saglam = d.esit && d.geometrik && d.esit.jaccard_top3 === 1 && d.geometrik.jaccard_top3 === 1;
      const kapiMetni = g === 'genel' ? 'The General mission has no gate: every land window is scored.' : T.kapi[g].metin;
      kok.innerHTML = `
        <div class="kutular">
          <div class="kutu"><div class="etiket">Best match</div><div class="sayi">${V.puanYuzde(ilk[0].P)}</div><div class="alt">The weighted average of the category similarities for this mission. It is 0% if the mission requirement is not met.</div></div>
          <div class="kutu"><div class="etiket">Earth windows compared</div><div class="sayi mono">${o.E_g.toLocaleString('en')}</div><div class="alt">of ${O.E_prime.toLocaleString('en')} land windows meet this mission's requirement; every one of them was scored.</div></div>
          <div class="kutu"><div class="etiket">Mission requirement</div><div class="sayi" style="font-size:20px">${g === 'genel' ? 'none' : (o.kapi_yedek ? 'fallback threshold' : 'main threshold')}</div><div class="alt">${kapiMetni}</div></div>
          <div class="kutu"><div class="etiket">Robustness</div><div class="sayi" style="font-size:20px">${saglam ? 'top 3 unchanged' : 'top 3 shifts'}</div><div class="alt">${saglam ? T.duyarlilik.saglam : T.duyarlilik.degisti}</div></div>
        </div>
        <div class="en-iyi">
          <div class="harita" id="harita"></div>
          <div class="kart2 en-iyi-sag" id="ozet-sag"></div>
        </div>
        <div class="iki">
          <div class="kart2" style="padding:12px 14px">
            <h3 style="margin:6px 8px 4px">The ten closest Earth sites</h3>
            <p class="soluk" style="font-size:13px;margin:0 8px 8px">Click a row to see it on the map.</p>
            <table class="tab" id="tablo"><thead><tr><th>#</th><th>Earth location</th><th>Score</th><th>Data</th></tr></thead><tbody></tbody></table>
          </div>
          <div class="kart2" id="detay"></div>
        </div>
        <h2 style="margin:44px 0 6px;font-size:24px">Best Earth site in each category</h2>
        <p class="soluk" style="margin-bottom:14px">${T.okunus.sampiyon}</p>
        <div class="sampiyon-grid2" id="sampiyon"></div>`;
      const tb = $('#tablo tbody');
      for (let i = 0; i < ilk.length; i++) {
        const r = ilk[i];
        const et = await V.analogEtiketi(r.en_yakin_analog ? r.en_yakin_analog.km : null);
        const kaps = r.s.filter(x => x != null).length;
        tb.insertAdjacentHTML('beforeend', `<tr class="satir" data-i="${i}">
          <td class="mono">${i + 1}</td>
          <td><span class="mono">${V.koordYazi(r.enlem, r.boylam)}</span><div class="yer-adi" style="margin:2px 0 0;font-size:12.5px" data-i="${i}"></div>${et ? `<br><span class="rozet rozet-${et.tur}" style="margin-top:4px" title="${et.aciklama}">${et.ad} · ${V.saha(r.en_yakin_analog.id)}</span>` : ''}</td>
          <td><div class="mono">${V.puanYuzde(r.P)}</div><div class="cubuk"><i style="width:${(100 * r.P).toFixed(1)}%"></i></div></td>
          <td class="mono">${kaps}/8</td></tr>`);
      }
      ilk.forEach((r, i) => V.yerYaz(tb.querySelector(`.yer-adi[data-i="${i}"]`), r.enlem, r.boylam));
      let harita = null;
      async function detay(i) {
        const r = ilk[i];
        document.querySelectorAll('#tablo tr.satir').forEach(t => t.classList.toggle('secili', Number(t.dataset.i) === i));
        const et = await V.analogEtiketi(r.en_yakin_analog ? r.en_yakin_analog.km : null);
        const gz = V.guclu_zayif(r.s);
        const notlar = await V.eksikNotlari(r.eksik_taraf);
        const durumAd = Object.values(T.kapi.durum).find(x => x.ad === r.kapi_durumu);
        $('#ozet-sag').innerHTML = `
          <div class="etiket">Earth site #${i + 1} · ${T.gorev[g].ad}</div>
          <h2 style="margin:6px 0 2px">${V.koordYazi(r.enlem, r.boylam)}</h2>
          <div class="yer-adi" id="ozet-yer"></div>
          ${et ? `<span class="rozet rozet-${et.tur}" title="${et.aciklama}">${et.ad} · ${V.saha(r.en_yakin_analog.id)} · ${r.en_yakin_analog.km.toFixed(0)} km</span>` : ''}
          <div style="display:flex;align-items:baseline;gap:12px;margin-top:10px"><span class="buyuk-puan">${V.puanYuzde(r.P)}</span><span class="soluk">match for ${h.ad}</span></div>
          <svg class="radar radar-buyuk" id="d-radar"></svg>
          <div class="lejant" style="display:flex;gap:16px;justify-content:center;font-size:13px;color:var(--muted)"><span>— Similarity</span><span style="color:var(--mismatch)">- - Mismatch</span><span>⋯ No data</span></div>`;
        $('#detay').innerHTML = `
          <h3 style="margin-top:0">Why it matches</h3><p>${gz.guclu.map(o => `<b>${V.KAT_AD[o.k]}</b> ${V.yuzde(o.x)}`).join(' · ')}</p>
          <h3>Where the analogy breaks</h3><p>${gz.zayif.map(o => `<b>${V.KAT_AD[o.k]}</b> ${V.yuzde(o.x)}`).join(' · ')}</p>
          <h3>Category by category</h3>
          ${katCubuklari(r.s, w)}
          <p class="soluk" style="font-size:12.5px;margin-top:8px"><b>How to read:</b> ${V.KAT_AD[gz.guclu[0].k]} ${Math.round(100 * gz.guclu[0].x)}% means ${T.okunus.s.replace('{X}', Math.round(100 * gz.guclu[0].x)).replace(/^./, c => c.toLowerCase()).replace(/\.$/, '')} (${V.KAT_AD[gz.guclu[0].k]}).</p>
          <details style="margin-top:10px"><summary class="soluk" style="cursor:pointer;font-size:13.5px">Raw distances and weights</summary>
          <table class="ck-tab"><tr><th>Category</th><th>Raw distance</th><th>Mission weight</th></tr>
            ${r.s.map((x, k) => `<tr><td>${V.KAT_AD[k]}</td><td class="mono">${r.d[k] == null ? '—' : r.d[k].toPrecision(3)}</td><td class="mono">${w[k].toFixed(3)}</td></tr>`).join('')}
          </table><p class="soluk" style="font-size:12.5px">${T.okunus.ham_uzaklik}</p></details>
          <h3>Mission requirement</h3><p><span class="rozet ${r.kapi_durumu === 'passed' ? 'rozet-gecti' : ''}">${r.kapi_durumu}</span> <span class="soluk" style="font-size:13px">${durumAd ? durumAd.aciklama : ''}</span></p>
          ${notlar.map(t => `<p class="soluk" style="font-size:13px">${t}</p>`).join('')}`;
        V.radar($('#d-radar'), r.s);
        V.yerYaz($('#ozet-yer'), r.enlem, r.boylam);
        harita = V.uyduHaritasi($('#harita'), r.enlem, r.boylam, { zoom: 11 });
      }
      document.querySelectorAll('#tablo tr.satir').forEach(t => t.addEventListener('click', () => { detay(Number(t.dataset.i)); $('#harita').scrollIntoView({ behavior: 'smooth', block: 'center' }); }));
      detay(0);
      $('#sampiyon').innerHTML = o.sampiyonlar.map((c, k) => c ? `
        <div class="sampiyon2"><div class="etiket">${V.KAT_AD[k]}</div><b class="mono">${V.koordYazi(c.enlem, c.boylam)}</b>
          <span class="soluk">similarity ${V.yuzde(c.s, 1)}</span></div>`
        : `<div class="sampiyon2"><div class="etiket">${V.KAT_AD[k]}</div><b>—</b><span class="soluk">no data</span></div>`).join('');
    }
  </script>
</body>
</html>
