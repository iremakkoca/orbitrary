<!DOCTYPE html>
<!-- Developed with assistance from Claude (Anthropic). -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="ai-assistance" content="Code developed with assistance from Claude (Anthropic). Data processing and method by the Orbitrary team.">
  <title>Orbitrary — Target analysis</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/analiz.css">
</head>
<body class="yildizli">
  <header class="ust">
    <a href="index.html" class="btn-link">← Home</a>
    <a href="index.html" class="logo" aria-label="Orbitrary">ORBITR<span class="ters">A</span>RY</a>
    <nav>
      <a href="explore.html">Explore</a>
      <a href="target.html" class="aktif">Targets</a>
      <a href="analogs.html">Analog sites</a>
      <a href="index.html#yontem">Method</a>
    </nav>
  </header>

  <section class="kahraman" id="kahraman">
    <div>
      <div class="etiket" id="k-ust">Target search</div>
      <h1 id="k-baslik">Targets</h1>
      <p id="k-alt"></p>
      <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:16px" id="k-butonlar"></div>
    </div>
  </section>

  <main class="sayfa" id="icerik"></main>

  <footer style="padding:30px 5vw;border-top:1px solid var(--line);display:flex;gap:18px;flex-wrap:wrap;align-items:center">
    <a href="index.html" class="btn-link">← Home</a>
    <span class="soluk" style="font-size:13px">NASA Space Apps Challenge 2026 project. Not an official NASA website. Every number on this page is read from the project's result files. Code developed with assistance from Claude (Anthropic).</span>
  </footer>

  <script type="module">
    import * as V from './js/veri.js';
    const $ = s => document.querySelector(s);
    const PARAM = new URLSearchParams(location.search);
    const id = PARAM.get('id');
    const [T, H, O, M] = await Promise.all([V.metin(), V.hedefler(), V.ozet(), V.meta()]);
    const govdeAd = c => c === 'ay' ? 'Moon' : 'Mars';

    if (!id) liste(); else hedefSayfasi(id);

    // ---------- 26 hedef listesi ----------
    function liste() {
      $('#k-ust').textContent = T.sayfa.target.baslik;
      $('#k-baslik').textContent = 'Choose a target';
      $('#k-alt').textContent = T.sayfa.target.giris;
      const grup = [
        ['Artemis', h => String(h.kimlik).startsWith('A3-'), T.uyari.artemis],
        ['Moon', h => h.cisim === 'ay' && !String(h.kimlik).startsWith('A3-'), 'Apollo landing sites and other lunar targets'],
        ['Mars', h => h.cisim === 'mars', 'Mars landing sites']];
      $('#icerik').innerHTML = grup.map(([ad, f, alt]) => `
        <h2 style="margin:40px 0 6px;font-size:26px">${ad}</h2><p class="soluk" style="margin-bottom:16px">${alt}</p>
        <div class="hedef-izgara">${H.filter(f).map(h => `
          <a class="hedef-kart" href="target.html?id=${encodeURIComponent(h.kimlik)}">
            <div class="etiket">${govdeAd(h.cisim)} · ${h.kimlik}</div>
            <div style="font-size:18px;font-weight:600;margin:6px 0">${h.ad}</div>
            <div class="soluk mono" style="font-size:13px">${V.koordYazi(h.enlem, h.boylam)}</div>
          </a>`).join('')}</div>`).join('');
    }

    // ---------- Bir hedefin tam analizi ----------
    async function hedefSayfasi(id) {
      const h = H.find(x => x.kimlik === id);
      if (!h) { $('#icerik').innerHTML = '<p>Unknown target.</p>'; return; }
      const L_ = await V.liste(id);
      document.title = `Orbitrary — ${h.ad}`;
      $('#k-ust').textContent = `${govdeAd(h.cisim)} · ${h.kimlik}${h.etiket ? ' · ' + h.etiket : ''}`;
      $('#k-baslik').textContent = h.ad;
      $('#k-alt').innerHTML = `${V.koordYazi(h.enlem, h.boylam, 3)}${h.koordinat_notu ? ' · ' + h.koordinat_notu : ''}${h.kaynak && h.kaynak !== h.koordinat_notu ? ' · source: ' + h.kaynak : ''}.<br>${T.sayfa.target.giris}`;
      $('#k-butonlar').innerHTML = `<a class="btn-ana" href="explore.html?body=${h.cisim === 'ay' ? 'moon' : 'mars'}&lat=${h.enlem}&lon=${h.boylam}&hedef=${encodeURIComponent(h.kimlik)}">Open in Explore 3D →</a>
        <a class="btn-link" href="target.html">All targets</a>`;
      const eksikHedef = L_.hedef.kategori_var.map((v, k) => v ? null : V.KAT_AD[k]).filter(Boolean);
      $('#icerik').innerHTML = `
        <div class="sekmeler" id="sekmeler">${V.GOREV_SIRA.map(g => `<button data-g="${g}">${T.gorev[g].ad}</button>`).join('')}</div>
        <p class="soluk" id="soru" style="font-size:17px"></p>
        ${eksikHedef.length ? `<div class="not">${eksikHedef.map(k => `${k}: ${T.eksik_taraf.hedef}`).join('<br>')}${!L_.hedef.islak ? '<br>' + T.uyari.kuru_hedef : ''}</div>` : ''}
        <div id="gorev-icerik"></div>`;
      const sec = g => {
        document.querySelectorAll('#sekmeler button').forEach(b => b.classList.toggle('secili', b.dataset.g === g));
        $('#soru').textContent = T.gorev[g].soru;
        gorevCiz(h, L_, g);
        history.replaceState(null, '', `?id=${encodeURIComponent(id)}&gorev=${g}`);
      };
      document.querySelectorAll('#sekmeler button').forEach(b => b.addEventListener('click', () => sec(b.dataset.g)));
      sec(V.GOREV_SIRA.includes(PARAM.get('gorev')) ? PARAM.get('gorev') : 'genel');
    }

    async function gorevCiz(h, L_, g) {
      const o = L_.gorevler[g], kok = $('#gorev-icerik');
      if (!o || o.durum !== 'computed') {
        kok.innerHTML = `<div class="kart2" style="margin-top:20px"><h2>Not applicable</h2><p class="soluk">${T.uyari.kuru_hedef}</p></div>`;
        return;
      }
      const ilk = o.ilk10, w = await V.agirliklar(g);
      const d = o.duyarlilik || {};
      const saglam = d.esit && d.geometrik && d.esit.jaccard_top3 === 1 && d.geometrik.jaccard_top3 === 1;
      const kapiMetni = g === 'genel' ? 'No gate for the General mission (not applicable).' : T.kapi[g].metin;
      kok.innerHTML = `
        <div class="kutular">
          <div class="kutu"><div class="etiket">Best mission score</div><div class="sayi">${ilk[0].P.toFixed(2)}</div><div class="alt">${T.okunus.P}</div></div>
          <div class="kutu"><div class="etiket">Earth windows searched</div><div class="sayi mono">${o.E_g.toLocaleString('en')}</div><div class="alt">of ${O.E_prime.toLocaleString('en')} land windows pass this mission's gate; all of them are scored (no prefilter).</div></div>
          <div class="kutu"><div class="etiket">Mission requirement (gate)</div><div class="sayi" style="font-size:20px">${g === 'genel' ? 'not applicable' : (o.kapi_yedek ? 'fallback threshold' : 'main threshold')}</div><div class="alt">${kapiMetni}</div></div>
          <div class="kutu"><div class="etiket">Robustness to weights</div><div class="sayi" style="font-size:20px">${saglam ? 'top 3 unchanged' : 'top 3 changes'}</div><div class="alt">${saglam ? T.duyarlilik.saglam : T.duyarlilik.degisti} Jaccard: equal weights ${d.esit ? d.esit.jaccard_top3.toFixed(2) : '—'}, geometric mean ${d.geometrik ? d.geometrik.jaccard_top3.toFixed(2) : '—'}.</div></div>
        </div>
        <div class="iki">
          <div>
            <div class="kart2" style="padding:12px 14px">
              <table class="tab" id="tablo"><thead><tr><th>#</th><th>Earth location</th><th>Label</th><th>Score</th><th>Data</th></tr></thead><tbody></tbody></table>
            </div>
            <div class="harita" id="harita" style="margin-top:18px"></div>
          </div>
          <div class="kart2" id="detay"></div>
        </div>
        <h2 style="margin:44px 0 6px;font-size:24px">Category champions</h2>
        <p class="soluk" style="margin-bottom:14px">${T.okunus.sampiyon}</p>
        <div class="sampiyon-grid2" id="sampiyon"></div>`;
      const tb = $('#tablo tbody');
      for (let i = 0; i < ilk.length; i++) {
        const r = ilk[i];
        const et = await V.analogEtiketi(r.en_yakin_analog ? r.en_yakin_analog.km : null);
        const kaps = r.s.filter(x => x != null).length;
        tb.insertAdjacentHTML('beforeend', `<tr class="satir" data-i="${i}">
          <td class="mono">${i + 1}</td>
          <td class="mono">${V.koordYazi(r.enlem, r.boylam)}</td>
          <td>${et ? `<span class="rozet rozet-${et.tur}" title="${et.aciklama}">${et.ad}</span>` : ''}</td>
          <td><div class="mono">${r.P.toFixed(3)}</div><div class="cubuk"><i style="width:${(100 * r.P).toFixed(1)}%"></i></div></td>
          <td class="mono">${kaps}/8</td></tr>`);
      }
      const harita = V.uyduHaritasi($('#harita'), ilk[0].enlem, ilk[0].boylam, {
        kare: false, noktalar: ilk.map((r, i) => ({ lat: r.enlem, lon: r.boylam, etiket: `#${i + 1} · ${r.P.toFixed(3)}`, renk: i < 3 ? '#5cc8ff' : '#8a97ab', tikla: () => detay(i) }))
      });
      let kareKatman = null;
      async function detay(i) {
        const r = ilk[i];
        document.querySelectorAll('#tablo tr.satir').forEach(t => t.classList.toggle('secili', Number(t.dataset.i) === i));
        const et = await V.analogEtiketi(r.en_yakin_analog ? r.en_yakin_analog.km : null);
        const gz = V.guclu_zayif(r.s);
        const notlar = await V.eksikNotlari(r.eksik_taraf);
        const durumAd = Object.values(T.kapi.durum).find(x => x.ad === r.kapi_durumu);
        $('#detay').innerHTML = `
          <div class="etiket">#${i + 1} · ${T.gorev[g].ad}</div>
          <h2>Earth site ${V.koordYazi(r.enlem, r.boylam)}</h2>
          ${et ? `<span class="rozet rozet-${et.tur}" title="${et.aciklama}">${et.ad}${et.tur !== 'new' ? ' · ' + V.saha(r.en_yakin_analog.id) : ''} · ${r.en_yakin_analog.km.toFixed(0)} km to the nearest documented analog</span>` : ''}
          <svg class="radar" id="d-radar" style="max-width:420px;display:block;margin:10px auto"></svg>
          <div class="lejant" style="display:flex;gap:16px;justify-content:center;font-size:13px;color:var(--muted)"><span>— Similarity</span><span style="color:var(--mismatch)">- - Mismatch</span><span>⋯ No data</span></div>
          <h3>Why it matches</h3><p>${gz.guclu.map(o => `<b>${V.KAT_AD[o.k]}</b> ${V.yuzde(o.x)}`).join(' · ')}</p>
          <h3>Where the analogy breaks</h3><p>${gz.zayif.map(o => `<b>${V.KAT_AD[o.k]}</b> ${V.yuzde(o.x)}`).join(' · ')}</p>
          <p class="soluk" style="font-size:13px"><b>How to read:</b> ${V.KAT_AD[gz.guclu[0].k]} ${Math.round(100 * gz.guclu[0].x)}% means ${T.okunus.s.replace('{X}', Math.round(100 * gz.guclu[0].x)).replace(/^./, c => c.toLowerCase()).replace(/\.$/, '')} (${V.KAT_AD[gz.guclu[0].k]}).</p>
          <h3>Category by category</h3>
          <table class="ck-tab"><tr><th>Category</th><th>Similarity</th><th>Raw distance</th><th>Weight</th></tr>
            ${r.s.map((x, k) => `<tr><td>${V.KAT_AD[k]}</td><td class="mono">${x == null ? 'no data' : V.yuzde(x, 1)}</td><td class="mono">${r.d[k] == null ? '—' : r.d[k].toPrecision(3)}</td><td class="mono">${w[k].toFixed(3)}</td></tr>`).join('')}
          </table>
          <p class="soluk" style="font-size:12.5px">${T.okunus.ham_uzaklik}</p>
          <h3>Mission requirement (gate)</h3><p><span class="rozet ${r.kapi_durumu === 'passed' ? 'rozet-gecti' : ''}">${r.kapi_durumu}</span> <span class="soluk" style="font-size:13px">${durumAd ? durumAd.aciklama : ''}</span></p>
          ${notlar.map(t => `<div class="not">${t}</div>`).join('')}`;
        V.radar($('#d-radar'), r.s);
        if (harita) {
          if (kareKatman) kareKatman.remove();
          const dl = 10 / 111.32, dL = 10 / (111.32 * Math.max(0.05, Math.cos(r.enlem * Math.PI / 180)));
          kareKatman = L.rectangle([[r.enlem - dl, r.boylam - dL], [r.enlem + dl, r.boylam + dL]], { color: '#ffd36b', weight: 2, fill: false }).addTo(harita);
          harita.setView([r.enlem, r.boylam], 9);
        }
      }
      document.querySelectorAll('#tablo tr.satir').forEach(t => t.addEventListener('click', () => detay(Number(t.dataset.i))));
      detay(0);
      $('#sampiyon').innerHTML = o.sampiyonlar.map((c, k) => c ? `
        <div class="sampiyon2"><div class="etiket">${V.KAT_AD[k]}</div><b class="mono">${V.koordYazi(c.enlem, c.boylam)}</b>
          <span class="soluk">similarity ${V.yuzde(c.s, 1)} · distance ${c.d.toPrecision(3)}</span></div>`
        : `<div class="sampiyon2"><div class="etiket">${V.KAT_AD[k]}</div><b>—</b><span class="soluk">no data</span></div>`).join('');
    }
  </script>
</body>
</html>
